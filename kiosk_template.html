<!DOCTYPE html>

<head>
<meta charset="UTF-8"><title>PXT Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#05070c;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;color:#eaf6ff;}
.kiosk{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0;opacity:.85;}
.bg-grad{position:absolute;inset:0;z-index:0;
    background:radial-gradient(circle at 20% 30%,rgba(0,180,255,.15),transparent 45%),
               radial-gradient(circle at 80% 70%,rgba(0,255,200,.12),transparent 45%),
               linear-gradient(120deg,#05070c,#0a0f1a 40%,#05070c);
    background-size:200% 200%;animation:bgshift 18s ease-in-out infinite;}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.grid-ov{position:absolute;inset:0;z-index:0;
    background-image:linear-gradient(rgba(0,220,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,220,255,.05) 1px,transparent 1px);
    background-size:42px 42px;mask-image:radial-gradient(circle at 50% 40%,black 10%,transparent 75%);}
.scrim{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 45%,rgba(5,7,12,.15),rgba(5,7,12,.85) 75%);}

.top-bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:transparent;}
.mic-ind{display:flex;align-items:center;gap:6px;}
.mic-dot{width:9px;height:9px;border-radius:50%;background:#ff5b5b;box-shadow:0 0 8px rgba(255,80,80,.8);transition:all .3s;}
.mic-dot.on{background:#46ffb0;box-shadow:0 0 10px rgba(70,255,176,.9);}
.mic-label{font-size:10px;color:#7fd0ef;letter-spacing:1px;text-transform:uppercase;}
.debug{color:#5fa8c4;font-size:10.5px;background:rgba(10,16,26,.5);padding:4px 12px;border-radius:999px;border:1px solid rgba(80,200,255,.15);max-width:50vw;text-align:center;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.brand{position:relative;z-index:2;color:#e8f6ff;letter-spacing:8px;font-size:20px;font-weight:700;opacity:.8;text-transform:uppercase;margin-bottom:16px;}
.pulse-ring{position:relative;z-index:2;width:110px;height:110px;border-radius:50%;border:2px solid rgba(0,190,255,.25);display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
.pulse-ring.active{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,190,255,.3)}50%{box-shadow:0 0 0 22px rgba(0,190,255,0)}}
.pulse-ring .icon{font-size:42px;}

.status-display{position:relative;z-index:2;text-align:center;max-width:500px;padding:0 20px;}
.status-main{font-size:13px;font-weight:400;color:rgba(234,246,255,.6);min-height:18px;transition:all .3s;letter-spacing:.3px;line-height:1.5;}
.status-sub{font-size:11px;color:rgba(127,208,239,.5);min-height:14px;transition:all .3s;margin-top:4px;}

.rcard{position:relative;z-index:2;background:rgba(15,22,34,.75);border:1px solid rgba(90,210,255,.25);border-radius:20px;padding:24px 32px;backdrop-filter:blur(14px);text-align:center;box-shadow:0 0 30px rgba(0,150,255,.1);margin-top:18px;animation:pop .4s ease;display:none;}
.rcard.show{display:block;}
.rcard .rn{font-size:20px;font-weight:700;margin-bottom:3px;}
.rcard .ri{font-size:11px;letter-spacing:2px;color:#7fd8ff;opacity:.7;margin-bottom:14px;text-transform:uppercase;}
.rcard .rg{display:flex;justify-content:space-around;gap:14px;flex-wrap:wrap;}
.rcard .rg .ri-item .lbl{font-size:9px;letter-spacing:1.5px;color:#8fb8cf;text-transform:uppercase;margin-bottom:3px;}
.rcard .rg .ri-item .val{font-size:16px;font-weight:600;}
.c-pres{color:#4dffb0;} .c-abs{color:#ff6767;} .c-oth{color:#ffd166;}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.pill{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:4;padding:8px 22px;border-radius:999px;background:rgba(10,16,26,.6);border:1px solid rgba(80,200,255,.2);backdrop-filter:blur(10px);text-align:center;max-width:90vw;}
.pill .p1{color:rgba(223,245,255,.7);font-size:11px;font-weight:500;letter-spacing:.4px;}

/* Start overlay */
.start-overlay{position:fixed;inset:0;z-index:100;background:rgba(5,7,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;backdrop-filter:blur(6px);}
.start-overlay h2{color:#eaf6ff;font-size:24px;font-weight:700;}
.start-overlay p{color:#8fb8cf;font-size:14px;max-width:400px;text-align:center;line-height:1.6;}
.sel-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.sel-wrap label{color:#7fd0ef;font-size:11px;letter-spacing:1px;text-transform:uppercase;}
.sel{padding:9px 16px;border-radius:12px;border:1px solid rgba(0,190,255,.3);background:rgba(10,16,26,.8);color:#dff5ff;font-size:13px;min-width:280px;outline:none;}
.sel option{background:#0a0d14;color:#dff5ff;}
.start-btn{padding:14px 36px;border-radius:999px;border:1px solid rgba(0,190,255,.4);background:rgba(0,150,255,.15);color:#dff5ff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;margin-top:6px;}
.start-btn:hover{background:rgba(0,150,255,.3);box-shadow:0 0 20px rgba(0,190,255,.3);}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}
.mic-test{display:flex;align-items:center;gap:10px;margin:4px 0;}
.mic-test-bar{width:160px;height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;}
.mic-test-fill{height:100%;width:0%;background:#46ffb0;border-radius:6px;transition:width .1s;}
.mic-test-label{font-size:10px;color:#8fb8cf;}
.voice-preview{padding:8px 18px;border-radius:999px;border:1px solid rgba(0,190,255,.25);background:rgba(0,150,255,.08);color:#9fd8ef;font-size:12px;cursor:pointer;transition:all .2s;margin-top:2px;}
.voice-preview:hover{background:rgba(0,150,255,.2);}
.theme-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,190,255,.4);background:linear-gradient(135deg,#0af,#0fa);cursor:pointer;transition:all .3s;opacity:.6;flex-shrink:0;}
.theme-dot:hover{opacity:1;box-shadow:0 0 12px rgba(0,190,255,.5);transform:scale(1.15);}
.theme-dot.alt{background:linear-gradient(135deg,#f0a,#fa0);}
</style>

/* ===== TTS =====
   IMPORTANT LIMITATION: this kiosk uses the browser's built-in Web Speech
   API (window.speechSynthesis) — there is no server/API integration here,
   so voice quality and which languages even have a voice at all depend
   entirely on what's installed on the machine/OS running the kiosk.
   A true "high-quality neural TTS with correct regional phonemes" (Azure
   Speech, Google Cloud TTS, ElevenLabs, etc.) would need a backend call
   with an API key and audio playback — that's a real architecture change,
   not a prompt/config tweak, and isn't something this static HTML file
   can add on its own. What IS fixed here: more robust matching so we
   actually find and use a native voice when the OS has one installed,
   instead of silently falling back to a mismatched/default voice. */
function normTag(s){return (s||'').toLowerCase().replace('_','-');}
function speak(text,cb,forceLang){
    speaking=true;stopListening();clearTimeout(silenceTimer);clearTimeout(sleepTimer);
    try{window.speechSynthesis.cancel();}catch(e){}
    setStatus(text,"");
    var u=new SpeechSynthesisUtterance(text);
    var lang=forceLang||(userLang==='en'?'en-US':userLang);
    u.lang=lang;u.rate=0.95;u.pitch=1.05;
    // Use chosen voice for English, auto-select for native
    if(lang==='en-US'&&chosenVoice){u.voice=chosenVoice;}
    else if(lang!=='en-US'){
        var voices=window.speechSynthesis.getVoices();
        var target=normTag(lang),base=target.split('-')[0];
        // exact tag match first, then base-language match (case/underscore tolerant)
        var nv=voices.find(function(v){return normTag(v.lang)===target;})
            ||voices.find(function(v){return normTag(v.lang).indexOf(base+'-')===0||normTag(v.lang)===base;});
        if(nv){u.voice=nv;}
        else{log('No native voice installed for '+lang+' — using device default');}
    }
    var done=false;function fin(){if(done)return;done=true;speaking=false;if(cb)cb();}
    u.onend=fin;u.onerror=fin;window.speechSynthesis.speak(u);
    setTimeout(fin,Math.max(text.length*100,3000)+5000);
}

function findStaff(t){

    for(var i=0;i<STAFF.length;i++){if(norm(STAFF[i].name)&&t.indexOf(norm(STAFF[i].name))>=0)return STAFF[i];}
    for(var i=0;i<STAFF.length;i++){var al=STAFF[i].aliases||[];for(var j=0;j<al.length;j++){if(al[j].length>1&&t.indexOf(norm(al[j]))>=0)return STAFF[i];}}
    for(var i=0;i<STAFF.length;i++){var tk=norm(STAFF[i].name).split(" ");if(tk.length>0&&tk.every(function(w){return t.indexOf(w)>=0;}))return STAFF[i];}
    var words=t.split(" ").filter(function(w){return w.length>=3;});
    for(var i=0;i<STAFF.length;i++){var tk=norm(STAFF[i].name).split(" ");
        for(var j=0;j<tk.length;j++){if(tk[j].length>=3){for(var k=0;k<words.length;k++){if(words[k]===tk[j])return STAFF[i];}}}
    }
    return null;
}

function findByBadge(id){
    id=id.trim();
    for(var i=0;i<STAFF.length;i++){

        if(id.length>=6 && sid.indexOf(id)>=0)return STAFF[i];

function isWakeWord(text){
    var t=norm(text);
    // Must have a greeting
    if(!/\b(hi|hey|hello|hai|hype|high|hike)\b/.test(t)) return false;
    // Must have something that sounds like PXT — any word with p/b/v + x/k/s
    var words=t.split(" ");
    for(var i=0;i<words.length;i++){
        var w=words[i];if(w.length<2)continue;
        if(/[pbvf]/.test(w)&&/[xkscz]/.test(w))return true;
    }
    // Also check: text, picks, fix, fax, pixel, etc
    if(/\b(text|picks?|pics?|pecks?|pixel|pixie|fix|fax)\b/.test(t))return true;
    // Last resort: any 2-4 char word with 'p' that isn't the greeting itself
    for(var i=0;i<words.length;i++){
        if(words[i].length>=2&&words[i].length<=5&&/p/.test(words[i])&&!/^(hi|hey|hello|high|hype)$/.test(words[i]))return true;
    }
    return false;
}

/* ===== EXTRACT NAME from speech ===== */
function extractName(text){
    var t=text.toLowerCase().trim();
    // Remove ALL filler/intro words
    var junk=["hi","hello","hey","salam","good morning","good afternoon","good evening",
              "my name is","my name","name is","i am","im","i'm","this is","its","it's",
              "mera naam hai","mera naam","naam hai","main hoon","main hun","call me",
              "you can call me","please","sir","madam","bhai","the","a","an","is","am",
              "are","was","um","uh","so","ok","okay","well","and","yes","yeah"];
    // Sort longest first so "my name is" matches before "my" and "name" and "is"
    junk.sort(function(a,b){return b.length-a.length;});
    for(var i=0;i<junk.length;i++){
        var re=new RegExp("\\b"+junk[i].replace(/\s+/g,"\\s+")+"\\b","gi");
        t=t.replace(re,"");
    }
    t=t.replace(/\s+/g," ").trim();
    // If nothing left, take last word from original
    if(t.length<2){
        var w=text.trim().split(/\s+/);
        t=w[w.length-1];
    }
    // Capitalize
    return t.split(" ").filter(function(w){return w.length>=2;}).slice(0,2)
        .map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(" ")||text.trim();
}

/* ===== FUZZY COMPREHENSION FALLBACK =====
   The intent matching below is regex/keyword based, so misspellings,
   ASR mis-hearings, or unfamiliar phrasing fall straight to the generic
   reply. This adds a lightweight typo-correction pass that only kicks in
   when nothing matched, so it never overrides a confident regex hit.
   NOTE: this is NOT true semantic understanding — it corrects near-miss
   spellings of known keywords (e.g. "shft"->"shift", "manger"->"manager").
   Real free-form semantic comprehension would need an actual NLU/LLM
   backend call, which this static, client-only kiosk page doesn't have
   wired up (no server or API key is configured here). */
var FUZZY_WORDS=['shift','manager','department','leave','holiday','off','agency','company',
    'joining','phone','birthday','hours','timing','pickup','email','country','language',
    'tenure','contract','joke','time','date','help','thanks','bye','hello','hi'];
function levenshtein(a,b){
    var m=a.length,n=b.length,d=[];
    for(var i=0;i<=m;i++)d[i]=[i];
    for(var j=0;j<=n;j++)d[0][j]=j;
    for(var i=1;i<=m;i++)for(var j=1;j<=n;j++){
        d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);
    }
    return d[m][n];
}
function fuzzyCorrect(t){
    return t.split(' ').map(function(w){
        if(w.length<3) return w;
        var best=null,bestD=99;
        FUZZY_WORDS.forEach(function(fw){
            var d=levenshtein(w,fw);
            if(d<bestD){bestD=d;best=fw;}
        });
        var tolerance=w.length>5?2:1;
        return (best&&bestD>0&&bestD<=tolerance)?best:w;
    }).join(' ');
}
// Wrapper: retry once with fuzzy-corrected text if the strict matcher
// only produced the generic fallback reply.
function getResponseSmart(text){
    var r=getResponse(text);
    if(r&&r.fallback){
        var corrected=fuzzyCorrect(norm(text));
        if(corrected!==norm(text)){
            var r2=getResponse(corrected);
            if(r2&&!r2.fallback) return r2;
        }
    }
    return r;
}

    // Language
    if(/(language|bhaasha|zubaan|lugha|wika)/i.test(t)){
        if(s&&s.language){var txt=tr('your_language')?N+", "+tr('your_language')+" "+s.language+".":N+", your language is "+s.language+".";
            return{type:'ai',showcard:true,cardinfo:[['Language',s.language],['Home Country',s.country||'\u2014'],['Department',s.dept]],text:txt};}
        return{type:'ai',text:N+", "+nf+"."};
    }
    // Tenure / Contract
    if(/(tenure|contract|aqd|mkataba|kontrata)/i.test(t)){
        if(s&&s.tenure_end&&s.tenure_end!=='nan'){var txt=tr('your_tenure')?N+", "+tr('your_tenure')+" "+s.tenure_end+".":N+", your tenure end date is "+s.tenure_end+".";
            return{type:'ai',showcard:true,cardinfo:[['Tenure End',s.tenure_end],['DOJ',s.doj],['Agency',s.company]],text:txt};}
        return{type:'ai',text:N+", "+nf+"."};
    }
    // My info / all details
    if(/(my info|my detail|my record|about me|my data|meri detail|mera record|sab batao)/i.test(t)){
        if(s)return{type:'card',text:N+"! "+(tr('your_shift')||"Shift")+": "+s.shift+". "+(tr('your_off')||"Week off")+": "+s.off1+" "+a+" "+s.off2+". "+(tr('your_dept')||"Department")+": "+s.dept+"."};
        return{type:'ai',text:N+", "+nf+"."};
    }
    // Greetings
    if(/\b(hi|hello|hey|salam|assalam|namaste|namaskaram|habari|bonjour)\b/i.test(t))return{type:'ai',text:g+", "+N+"! "+(tr('how_are')||pick(["How are you?","What's up?","Welcome!"]))};
    if(/(how are you|kaise ho|kya haal|kya hal|kayf halak|kaisa hai)/i.test(t))return{type:'ai',text:tr('how_are')||pick(["Great "+N+"!","Fantastic "+N+"!","100% "+N+"!"])};
    if(/(who are you|your name|kaun ho|tumhara naam)/i.test(t))return{type:'ai',text:"PXT Hub, "+N+"!"};
    // Capabilities — previously listed only 4-5 items; now enumerates
    // every data field this kiosk can actually answer from the roster,
    // built dynamically instead of a hardcoded short list.
    if(/(what can you do|help|madad|sahayam|kya kar sakte|capabilit|features|what.+know)/i.test(t)){
        var CAPS=['your shift','week off / leave days','department','manager','agency or company',
            'date of joining','phone number','birthday month','working hours','shift timing',
            'pickup point','email address','home country','language on file','contract/tenure end date',
            'the current time','today\'s date','a joke if you need one'];
        var intro=tr('how_help')||("Here's everything I can help you with, "+N+":");
        return{type:'ai',text:intro+" You can ask me about: "+CAPS.join(", ")+"."};
    }
    if(/(what time|time kya|waqt|kitne baje)/i.test(t))return{type:'ai',text:timeStr()+", "+N+"."};
    if(/(what date|what day|today|aaj|tarikh)/i.test(t))return{type:'ai',text:dateStr()+", "+N+"."};
    if(/\b(thank|thanks|shukriya|dhanyavaad|nanni|asante|merci|shukran)\b/i.test(t))return{type:'ai',text:tr('thanks')||pick(["Welcome "+N+"!","No problem "+N+"!","Anytime "+N+"!"])};
    if(/\b(bye|goodbye|see you|take care|alvida|khuda hafiz|kwaheri|vida)\b/i.test(t))return{type:'bye',text:tr('bye')||"Goodbye "+N+"! Say Hi PXT when you need me!"};
    if(/(joke|funny|laugh|bored|mazak|hansi)/i.test(t))return{type:'ai',text:tr('joke')||pick(["Why did the employee bring a ladder? To reach new heights!","HR's favorite music? Staff notation!","Calendar stressed? Its days were numbered!"])};
    if(/(tired|sad|stressed|thaka|dukhi)/i.test(t))return{type:'ai',text:g+", "+N+"!"};
    if(/(happy|excited|great|awesome|khush|accha)/i.test(t))return{type:'ai',text:g+", "+N+"!"};
    return{type:'ai',fallback:true,text:tr('how_help')||pick(["Try 'my shift', 'my week off', or 'my manager', "+N+"!",N+", ask me anything!","I'm here "+N+"!"])};
}

/* ===== RECOGNITION — instant restart, no gaps ===== */
function stopListening(){
    listening=false;clearTimeout(restartTimeout);clearTimeout(silenceTimer);
    if(rec){try{rec.abort();}catch(e){}rec=null;}setMic(false);
}

function startListening(){
    if(!shouldRun||speaking||listening)return;
    stopListening();
    rec=new SR();
    rec.continuous=false;
    rec.interimResults=true;
    rec.lang='en-US'; // Always listen in English — responses will be in native language
    rec.maxAlternatives=1;
    var wakeHandled=false;

    rec.onstart=function(){
        listening=true;setMic(true);
        if(state==='sleep'){log('Waiting for "Hi PXT"...');setStatus("","Say \"Hi PXT\" to wake me up");setPill("Say \"Hi PXT\"");}
        else if(state==='wake_listen'){log('Say your name...');setStatus("","tell me your name");setPill("Your name?");}
        else if(state==='lang_choose'){log('Choose language...');setStatus("","English or "+userNativeName+"?");setPill("English or "+userNativeName+"?");}
        else{log('Listening...');setStatus("","listening");setPill("Listening...");}
    };
    rec.onend=function(){
        listening=false;setMic(false);
        if(shouldRun&&!speaking) restartTimeout=setTimeout(startListening,50);
    };
    rec.onerror=function(e){
        listening=false;setMic(false);
        if(e.error==='not-allowed'){log('Mic blocked');return;}
        if(shouldRun&&!speaking) restartTimeout=setTimeout(startListening,50);
    };
    rec.onresult=function(ev){
        lastActivity=Date.now();
        var txt="";
        for(var i=ev.resultIndex;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
        log('Heard: '+txt);

        // SLEEP: check for wake word (interim OK for speed)
        if(state==='sleep'){
            if(!wakeHandled && isWakeWord(txt)){
                wakeHandled=true;
                try{rec.stop();}catch(e){}
                handleWake();
            }
            return; // Never process anything else in sleep mode
        }

        // If wake just handled this session, ignore leftover results
        if(wakeHandled) return;

        // LOGIN / READY: only act on final results
        var last=ev.results[ev.results.length-1];
        if(last && last.isFinal){
            var final_txt=last[0].transcript.trim();
            if(final_txt.length<2) return;
            if(state==='wake_listen') handleLogin(final_txt);
            else if(state==='lang_choose') handleLangChoice(final_txt);
            else if(state==='ready') handleInput(final_txt);
        }
    };

    try{rec.start();}catch(e){listening=false;restartTimeout=setTimeout(startListening,100);}
}

/* ===== HANDLERS ===== */
function handleWake(){
    stopListening();state='wake_listen';
    // Show badge input
    var bw=document.getElementById('badgeWrap');if(bw)bw.style.display='block';
    var bi=document.getElementById('badgeInput');if(bi){bi.value='';bi.focus();}
    speak(timeGreet()+"! Welcome to PXT Hub. Please enter your badge number.",function(){startListening();});
}

function handleLogin(text){
    stopListening();hideCard();
    var digits=text.replace(/[^0-9]/g,"");
    var staff=null;
    var name=text.trim();
    if(digits.length>=5) staff=findByBadge(digits);
    if(!staff){name=extractName(text);staff=findStaff(name)||findStaff(text);}
    if(staff){
        userName=staff.name.split(" ")[0];userStaff=staff;
        userLang='en';userNativeName='';
        var bw=document.getElementById('badgeWrap');if(bw)bw.style.display='none';
        // Check if staff has a native language
        var nativeLang=extractNativeLang(staff.language);
        if(nativeLang){
            userNativeName=nativeLang.name;
            state='lang_choose';
            speak(timeGreet()+", "+staff.name+"! Welcome to PXT Hub. Would you like to continue in English or "+nativeLang.name+"?",
                function(){startListening();});
        } else {
            state='ready';
            speak(timeGreet()+", "+staff.name+"! Welcome to PXT Hub. How can I help you today?",
                function(){setTimeout(hideCard,4000);resetSleepTimer();startListening();});
        }
    } else if(digits.length>=5){
        var bw=document.getElementById('badgeWrap');if(bw)bw.style.display='block';
        var bi=document.getElementById('badgeInput');if(bi){bi.value='';bi.focus();}
        speak("Sorry, badge "+digits+" was not found. Please check and try again.",function(){state='wake_listen';startListening();});
    } else {
        userName=name;userStaff=null;state='ready';
        var bw=document.getElementById('badgeWrap');if(bw)bw.style.display='none';
        speak(timeGreet()+", "+userName+"! I couldn't find your record. Please try your badge number instead.",
            function(){resetSleepTimer();startListening();});
    }
}

function handleLangChoice(text){
    stopListening();
    var t=norm(text);
    var nativeLang=extractNativeLang(userStaff.language);
    if(nativeLang && (t.indexOf(nativeLang.name.toLowerCase())>=0 || t.indexOf('native')>=0 || t.indexOf('my language')>=0 || t.indexOf('second')>=0 || t.indexOf('other')>=0)){
        userLang=nativeLang.code;
        state='ready';
        speak(nativeLang.greet+", "+userName+"! "+nativeLang.name+" selected. How can I help you?",
            function(){resetSleepTimer();startListening();},nativeLang.tts);
    } else {
        userLang='en';
        state='ready';
        speak("English it is, "+userName+"! How can I help you today?",
            function(){resetSleepTimer();startListening();});
    }
}
/* ===== EXPLICIT LANGUAGE SWITCH (mid-conversation) =====
   Previously there was no way to change language once picked at login —
   userLang only ever changed at handleLangChoice() or on sleep/reset.
   That's actually why it "never reverted", but it also meant a user could
   never say "switch to English" later; unmatched attempts just fell
   through to the generic response. This adds that explicit command
   without touching persistence for anything else. */
function detectLangSwitchRequest(text){
    var t=norm(text);
    if(!/(switch|change|speak|talk|reply|answer|continue|go back)/.test(t)) return null;
    if(/\benglish\b/.test(t)) return {code:'en',name:'English'};
    for(var key in LANG_MAP){
        if(t.indexOf(key)>=0){
            var L=LANG_MAP[key];
            return {code:L.code,name:L.name,tts:L.tts,greet:L.greet};
        }
    }
    return null;
}

function handleInput(text){
    stopListening();hideCard();clearTimeout(sleepTimer);
    if(state==='ready'){
        var sw=detectLangSwitchRequest(text);
        if(sw){
            userLang=sw.code;userNativeName=sw.code==='en'?'':sw.name;
            var msg=sw.code==='en'
                ? ("English it is, "+userName+"! How can I help you today?")
                : (sw.greet+", "+userName+"! "+sw.name+" selected. How can I help you?");
            speak(msg,function(){resetSleepTimer();startListening();},sw.tts);
            return;
        }
    }
    var r=getResponseSmart(text);
    setTimeout(function(){
        if(r.type==='bye'){speak(r.text,function(){goToSleep();});return;}
        if(r.type==='card'&&userStaff){showCard(userStaff,r.cardinfo);speak(r.text,function(){setTimeout(hideCard,4000);resetSleepTimer();startListening();});}
        else if(r.type==='ai'&&userStaff&&r.showcard){showCard(userStaff,r.cardinfo);speak(r.text,function(){setTimeout(hideCard,4000);resetSleepTimer();startListening();});}
        else{speak(r.text,function(){resetSleepTimer();startListening();});}
    },200);
}

/* ===== WATCHDOG ===== */
setInterval(function(){
    if(!speaking&&shouldRun&&!listening){
        log("Restarting mic...");lastActivity=Date.now();startListening();
    }
},3000);

/* ===== VISIBILITY — restart when tab becomes visible ===== */
document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&shouldRun&&!speaking&&!listening){
        log("Tab visible — restarting");setTimeout(startListening,300);
    }
});

/* ===== START ===== */
startBtn.onclick=async function(){
    if(testStream){testStream.getTracks().forEach(function(t){t.stop();});}if(testMeter){testMeter.stop();}
    $('startOverlay').style.display='none';$('kiosk').style.display='flex';
    if(VIDEO_SRC){bgVideo.src=VIDEO_SRC;bgVideo.style.display="block";bgVideo.muted=false;bgVideo.volume=0.12;
        bgVideo.play().then(function(){if(bgGrad)bgGrad.style.display="none";}).catch(function(){bgVideo.muted=true;bgVideo.play().catch(function(){});});}
    try{var w=new SpeechSynthesisUtterance(' ');w.volume=0;if(chosenVoice)w.voice=chosenVoice;window.speechSynthesis.speak(w);}catch(e){}
    try{var c=selectedDeviceId?{audio:{deviceId:{exact:selectedDeviceId}}}:{audio:true};
        micStream=await navigator.mediaDevices.getUserMedia(c);
        log('Mic: '+(micStream.getAudioTracks()[0].label||'?'));
        state='sleep';
        speak("PXT Hub ready! Say Hi PXT whenever you need me.",function(){startListening();});
    }catch(e){log('Mic error');setStatus("Mic failed","Refresh page");}
};

window.addEventListener('beforeunload',function(){shouldRun=false;stopListening();try{window.speechSynthesis.cancel();}catch(e){}});
loadMics();
})();

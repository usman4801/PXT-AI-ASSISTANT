<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PXT Kiosk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: #05070c;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 10px;
    }
    .container {
      width: 100%;
      max-width: 950px;
      text-align: center;
    }
    .banner-wrapper {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    }
    video.banner {
      width: 100%;
      height: auto;
      max-height: 380px;
      display: block;
      object-fit: contain;
    }
    h1 { font-size: 2.2rem; margin-bottom: 8px; color: #f3f4f6; }
    p.subtitle { color: #9ca3af; font-size: 1.1rem; margin-bottom: 25px; }
    .search-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      width: 60%;
      min-width: 250px;
      padding: 14px 22px;
      font-size: 1.1rem;
      border-radius: 30px;
      border: 1px solid #374151;
      background: #111827;
      color: #fff;
      outline: none;
      transition: 0.3s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59,130,246,0.5);
    }
    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 30px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    button:hover { background: #1d4ed8; }
    button.mic-btn { background: #dc2626; }
    button.mic-btn.listening {
      animation: pulse 1.2s infinite;
      background: #ef4444;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(239,68,68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68, 0); }
    }
    .card {
      display: none;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      text-align: left;
      margin: 15px auto 0 auto;
      max-width: 650px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card h2 { color: #60a5fa; margin-bottom: 15px; font-size: 1.6rem; }
    .card-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #1f2937;
    }
    .card-row:last-child { border-bottom: none; }
    .card-row span.label { color: #9ca3af; font-weight: 500; font-size: 1.05rem; }
    .card-row span.val { color: #f9fafb; font-weight: 600; font-size: 1.05rem; }
  </style>
</head>
<body>

  <div class="container">
    <div class="banner-wrapper">
      <video class="banner" src="__VIDEO__" autoplay loop muted playsinline></video>
    </div>
    
    <h1>PXT AI Assistant</h1>
    <p class="subtitle">Search by Name, Employee ID, or click Mic to speak</p>

    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Type Name or ID..." onkeypress="if(event.key==='Enter') searchStaff()">
      <button onclick="searchStaff()">Search</button>
      <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎤 Mic</button>
    </div>

    <div id="resultCard" class="card">
      <h2 id="empName">Employee Name</h2>
      <div class="card-row"><span class="label">Employee ID:</span><span class="val" id="empId">-</span></div>
      <div class="card-row"><span class="label">Status:</span><span class="val" id="empStatus">-</span></div>
      <div class="card-row"><span class="label">Remaining Leaves:</span><span class="val" id="empLeaves">-</span></div>
      <div class="card-row"><span class="label">Next Off Day:</span><span class="val" id="empNextOff">-</span></div>
    </div>
  </div>

  <script>
    const staffData = __STAFF__;

    // Text to Speech (Bolne ka function)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop any ongoing speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        utterance.pitch = 1.0;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function searchStaff(query) {
      const inputVal = document.getElementById('queryInput').value;
      const q = (query || inputVal).trim().toLowerCase();
      if (!q) return;

      // Find staff record
      const found = staffData.find(item => {
        if (item.id.toLowerCase() === q) return true;
        if (item.name.toLowerCase().includes(q)) return true;
        if (item.aliases && item.aliases.some(a => a.toLowerCase().includes(q))) return true;
        return false;
      });

      const card = document.getElementById('resultCard');
      if (found) {
        document.getElementById('empName').innerText = found.name;
        document.getElementById('empId').innerText = found.id;
        document.getElementById('empStatus').innerText = found.status;
        document.getElementById('empLeaves').innerText = found.leaves;
        document.getElementById('empNextOff').innerText = found.nextoff;
        card.style.display = 'block';

        // Assistant voice answer
        const speechMsg = `Hello ${found.name}. Your status is ${found.status}. You have ${found.leaves} remaining leaves, and your next off day is ${found.nextoff}.`;
        speakText(speechMsg);
      } else {
        const notFoundMsg = "Sorry, no staff record found for " + q;
        speakText(notFoundMsg);
        alert(notFoundMsg);
        card.style.display = 'none';
      }
    }

    // Voice recognition (Sunne ka function)
    let recognition;
    function toggleMic() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Microphone recognition support nahi kar raha. Kindly Google Chrome use karein.");
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
          const micBtn = document.getElementById('micBtn');
          micBtn.classList.add('listening');
          micBtn.innerText = "Listening...";
        };

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          document.getElementById('queryInput').value = transcript;
          searchStaff(transcript);
        };

        recognition.onend = function() {
          const micBtn = document.getElementById('micBtn');
          micBtn.classList.remove('listening');
          micBtn.innerText = "🎤 Mic";
        };

        recognition.onerror = function(event) {
          console.error("Mic error:", event.error);
          const micBtn = document.getElementById('micBtn');
          micBtn.classList.remove('listening');
          micBtn.innerText = "🎤 Mic";
          if (event.error === 'not-allowed') {
            alert("Microphone access blocked hai. Browser URL bar mein lock icon par click kar ke microphone allow karein.");
          }
        };
      }

      try {
        recognition.start();
      } catch (err) {
        recognition.stop();
      }
    }
  </script>
</body>
</html>
